<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mood: Jazz (Gauri)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">
</head>


<body>

<div class="scene" id="scene">


  <!-- =====================================================
       INDIA CLOCK
       ===================================================== -->

  <div class="india-clock" id="indiaClock">

    <span id="clockHours">00</span>
    <span class="clock-colon">:</span>
    <span id="clockMinutes">00</span>

  </div>


  <!-- =====================================================
       JAZZ / GAURI TITLE
       ===================================================== -->

  <div class="jazz-title">

    <img
        src="assets/covers/jazz-gauri-transparent.svg"
        alt="जैज़ (गौरी)"
    >

  </div>


  <!-- =====================================================
       ALBUM COVER + PLAYLIST
       ===================================================== -->

  <div class="cover-frame" id="coverFrame">


    <!-- Permanent album cover -->

    <div class="cover-frame-art" id="coverArtLarge">

      <button
          class="album-cover-button"
          id="albumCoverButton"
          aria-label="Open playlist"
      >

        <img
            src="assets/covers/AlbumCover.png"
            alt="Open playlist"
        >

      </button>

    </div>


    <!-- Current playlist information -->

    <div
        class="cover-frame-label"
        id="nowPlayingLabel"
    >
        No playlist loaded yet
    </div>


    <!-- =================================================
         EXPANDABLE PLAYLIST

         This stays underneath the album cover and will
         be opened by clicking the album cover.
         ================================================= -->

    <div
        class="playlist-panel"
        id="playlistPanel"
    >

      <div class="playlist-header">

        <div>

          <div class="playlist-heading">
            PLAYLIST
          </div>

          <div
              class="playlist-name"
              id="playlistName"
          >
              Mood: Jazz (Gauri)
          </div>

        </div>

      </div>


      <!-- Songs will be generated by JavaScript -->

      <div
          class="playlist-songs"
          id="playlistSongs"
      ></div>

    </div>


  </div>


  <!-- =====================================================
       LYRICS PANEL (right column)
       ===================================================== -->

  <div class="lyrics-panel" id="lyricsPanel" aria-hidden="true">

    <div class="lyrics-header">

      <div class="lyrics-heading">LYRICS</div>

      <button
          class="lyrics-close-btn"
          id="lyricsCloseBtn"
          aria-label="Close lyrics"
      >
          ✕
      </button>

    </div>

    <div
        class="lyrics-track-info"
        id="lyricsTrackInfo"
    ></div>

    <div
        class="lyrics-content"
        id="lyricsContent"
    >
        <p class="lyrics-empty">No lyrics available for this track.</p>
    </div>

  </div>


  <!-- =====================================================
       EXPANDED SONG COVER OVERLAY
       ===================================================== -->

  <div
      class="cover-overlay"
      id="coverOverlay"
      aria-hidden="true"
  >

    <button
        class="cover-overlay-image"
        id="coverOverlayImage"
        aria-label="Close expanded cover"
    >

      <img
          src="assets/covers/placeholder-cover.svg"
          alt="Expanded song cover"
      >

    </button>

  </div>


  <!-- =====================================================
       BOTTOM-DOCKED PLAYER
       ===================================================== -->

  <div
      class="player-bar"
      id="playerBar"
  >


    <div
        class="bar-art"
        id="coverArtSmall"
    >

      <img
          src="assets/covers/placeholder-cover.svg"
          alt="Album cover"
      >

    </div>


    <div class="bar-main">


      <div class="bar-track-info">

        <span
            class="track-title"
            id="trackTitle"
        >
            No track loaded
        </span>

        <span
            class="track-artist"
            id="trackArtist"
        >
            Add your playlist to get started
        </span>

      </div>


      <div class="bar-transport">

        <button
            class="transport-btn"
            id="prevBtn"
            aria-label="Previous track"
        >
            ⏮
        </button>


        <button
            class="play-btn"
            id="playBtn"
            aria-label="Play"
        >
            ▶
        </button>


        <button
            class="transport-btn"
            id="nextBtn"
            aria-label="Next track"
        >
            ⏭
        </button>


        <div class="bar-progress">

          <span
              class="time-elapsed"
              id="timeElapsed"
          >
              0:00
          </span>


          <div
              class="progress-track"
              id="progressTrack"
          >

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

          </div>


          <span
              class="time-total"
              id="timeTotal"
          >
              0:00
          </span>

        </div>

      </div>

    </div>


    <!-- Three-dot button + options menu -->

    <div class="dots-menu-wrap">

      <button
          class="dots-btn"
          id="dotsBtn"
          aria-label="Player options"
          aria-haspopup="true"
          aria-expanded="false"
      >
          ⋮
      </button>

      <div
          class="dots-menu"
          id="dotsMenu"
          role="menu"
          aria-hidden="true"
      >

        <button
            class="dots-menu-item"
            id="lyricsMenuBtn"
            role="menuitem"
        >
            Lyrics
        </button>

      </div>

    </div>


  </div>


</div>


<!-- =======================================================
     JAVASCRIPT
     ======================================================= -->

<script src="js/playlists.js"></script>
<script src="js/script.js"></script>

</body>
</html>
